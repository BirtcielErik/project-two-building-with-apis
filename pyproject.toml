[project]
name = "one-more-chapter"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "django>=6.1.3",
    "django-tailwind-cli>=4.8.2",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-django>=4.14.0",
    "responses>=0.26.3",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings_test"
python_files = ["test_*.py"]


[tool.ruff]
line-length = 100
# Format as Python 3.13 so multi-exception handlers keep their familiar parentheses:
# `except (A, B):` instead of 3.14's `except A, B:`.
target-version = "py313"
# Migrations are generated by Django; scripts/ holds the pre-Django research script.
extend-exclude = ["*/migrations/*", "scripts/"]

[tool.ruff.lint]
# E/W: style errors, F: real bugs (unused names...), I: import order,
# UP: modern Python syntax, B: likely bugs, DJ: Django best practices.
select = ["E", "W", "F", "I", "UP", "B", "DJ"]
